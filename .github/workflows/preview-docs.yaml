# Deploys the docs site, with the browser preview at /play, to Cloudflare Pages for each pull
# request that changes it, since GitHub Pages only has the one site. R2's CORS policy lets
# https://*.quake-kube-docs.pages.dev read the preview's game files.
name: Preview docs

on:
  pull_request:
    paths:
      - ".github/workflows/preview-docs.yaml"
      - "Taskfile.yml"
      - "flake.lock"
      - "flake.nix"
      - "controllers/static/**"
      - "docs/**"
      - "hack/k3d/presets.yaml"
      - "hack/mdbook-pikchr/**"
      - "hack/play-site/**"
      - "internal/quake/content/**"
      - "nix/**"

permissions:
  contents: read
  pull-requests: write

# Only the pull request's latest commit matters.
concurrency:
  group: preview-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks don't get the secrets this needs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Like publish-docs.yaml, so the web client is only rebuilt when it changes.
      - uses: cachix/cachix-action@v16
        with:
          name: quake-kube
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-content-[^/]*$|\.tar\.gz$|-layer$|\.zip$|\.pk3$|-source$)'
      # Builds with the flake's CI shell, so with the same mdbook as development.
      - run: nix develop .#ci --command task docs:site

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/book --project-name=quake-kube-docs --branch=pr-${{ github.event.pull_request.number }}
      - name: Comment with the link
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deployment.outputs.pages-deployment-alias-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Docs preview: $URL (from $SHA). Browser preview: $URL/play/"
