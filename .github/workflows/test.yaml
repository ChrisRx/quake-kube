name: Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Lints and tests with the flake's dev shell, so CI uses the same tools as
  # development.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Lint and test
        run: nix develop --command task lint test

  # Checks the flake and builds the images, which are otherwise only built
  # when they're pushed from main.
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Check the flake
        run: nix flake check
      - name: Build the images
        run: nix build --print-build-logs .#server-image .#controller-image
