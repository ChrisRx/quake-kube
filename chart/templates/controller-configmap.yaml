apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
data:
  config.yaml: |
    master:
      port: {{ .Values.master.port }}
      # Game servers send heartbeats here so the list refreshes when they change.
      address: {{ printf "%s-master.%s.svc:%v" (include "chart.fullname" .) .Release.Namespace .Values.master.port | quote }}
    gateway:
      port: 8080
      namespace: {{ .Values.gateway.namespace | default .Release.Namespace | quote }}
      maxServers: {{ .Values.gateway.maxServers }}
      {{- if not (kindIs "invalid" .Values.gateway.maxServersPerUser) }}
      maxServersPerUser: {{ .Values.gateway.maxServersPerUser }}
      {{- end }}
      idleTimeout: {{ .Values.gateway.idleTimeout | default "" | toString | quote }}
      presets:
        {{- include "chart.presets" . | nindent 8 }}
      {{- with .Values.gateway.auth }}
      auth:
        mode: {{ .mode }}
        {{- if eq .mode "iap" }}
        {{- if not (or .iap.audience .iap.projectNumber) }}
        {{- fail "gateway.auth.mode iap needs gateway.auth.iap.audience or gateway.auth.iap.projectNumber" }}
        {{- end }}
        iap:
          {{- with .iap.audience }}
          audience: {{ . | quote }}
          {{- end }}
          {{- with .iap.projectNumber }}
          projectNumber: {{ . | toString | quote }}
          {{- end }}
        {{- end }}
        {{- if eq .mode "header" }}
        header:
          user: {{ .header.user | quote }}
          {{- with .header.groups }}
          groups: {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- if .ticketSecretName }}
        ticketKeyFile: /etc/quake-kube/ticket/key
        {{- end }}
      {{- end }}
      webtransport:
        enabled: {{ .Values.gateway.webtransport.enabled }}
        port: 4433
        {{- with .Values.gateway.webtransport.publicAddress }}
        publicAddress: {{ . | quote }}
        {{- end }}
        publicPort: {{ .Values.gateway.webtransport.service.port }}
        {{- if .Values.gateway.webtransport.tls.secretName }}
        tlsDir: /etc/quake-kube/webtransport-tls
        {{- end }}
    gameServers:
      exposure:
        type: {{ .Values.gameServers.exposure.type }}
        {{- with .Values.gameServers.exposure.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.gameServers.exposure.portRange }}
        portRange: {{ . | quote }}
        {{- end }}
