{{- $namespace := .Values.gateway.namespace | default .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# Listing servers in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-gateway
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers"]
    verbs: ["get", "list", "watch"]
  {{- if ne .Values.gateway.auth.mode "none" }}
  # Asking whether people are admins.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-gateway
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.fullname" . }}-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.fullname" . }}-gateway
    namespace: {{ .Release.Namespace }}
{{- if gt (int .Values.gateway.maxServers) 0 }}
---
# Creating, changing and deleting servers, only in the namespace the web app
# uses. Patching marks servers idle.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-gateway
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers"]
    verbs: ["create", "update", "patch", "delete"]
  # Reading servers' rcon passwords, which authorize sending a server its
  # changed config so the change applies right away. RBAC can't limit this to
  # the servers' Secrets, so give the web app a namespace of its own (see
  # gateway.namespace) if others' Secrets are in the release namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Running pods that make thumbnails of each game's maps, which are kept in
  # ConfigMaps.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-gateway
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chart.fullname" . }}-gateway
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.fullname" . }}-gateway
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if ne .Values.gateway.auth.mode "none" }}
---
# Admins, who can delete anyone's servers from the web app. Bind it to people
# in the web app's namespace, or set gateway.auth.admins.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-admin
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers"]
    verbs: ["get", "list", "watch", "delete"]
{{- with .Values.gateway.auth.admins }}
{{- if or .users .groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" $ }}-admin
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.fullname" $ }}-admin
subjects:
  {{- range .users }}
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ . | quote }}
  {{- end }}
  {{- range .groups }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
