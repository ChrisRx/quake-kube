apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # There is no leader election yet, so two controllers must never run at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        # Restart the controller when its config changes.
        checksum/config: {{ include (print $.Template.BasePath "/controller-configmap.yaml") . | sha256sum }}
        {{- with .Chart.Annotations }}
        {{- with index . "quake.kube/commit" }}
        # The commit the published chart was built from, so upgrades restart the pods,
        # which pull the newest images.
        quake.kube/commit: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.controller.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.controller.logLevel | quote }}
            - name: QUAKE_KUBE_CONFIG
              value: /etc/quake-kube/config.yaml
            - name: QUAKE_SERVER_IMAGE
              value: "{{ .Values.gameServers.image.repository }}:{{ .Values.gameServers.image.tag | default .Chart.AppVersion }}"
          ports:
            - name: master
              containerPort: {{ .Values.master.port }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/quake-kube
              readOnly: true
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "chart.fullname" . }}-controller
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
