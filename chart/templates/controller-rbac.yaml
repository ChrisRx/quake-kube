apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-controller
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers/status"]
    verbs: ["get", "patch", "update"]
  # Needed to set blockOwnerDeletion on owned objects where the
  # OwnerReferencesPermissionEnforcement admission plugin is enabled.
  - apiGroups: ["quake.kube"]
    resources: ["quakeservers/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Each server's rendered config and rcon password. Not listed or watched.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
  # Finding the node a server runs on, for NodePort and HostPort addresses.
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-controller
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chart.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
