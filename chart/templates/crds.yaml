{{- /* CRD manifests are generated by `quake-kube-controller crdgen`. */ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- if $.Values.crds.keep }}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep") (default (dict) $crd.metadata.annotations) }}
{{- $crd = set $crd "metadata" (set $crd.metadata "annotations" $annotations) }}
{{- end }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
