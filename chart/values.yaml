# Default values for quake-kube.

crds:
  # Install the CRDs with the chart. Disable when CRDs are managed separately.
  install: true
  # Keep the CRDs, and with them every QuakeServer, when the release is
  # uninstalled.
  keep: true

controller:
  image:
    repository: ghcr.io/chrisrx/quake-kube-controller
    # Kubernetes' default when empty: images tagged latest are pulled every time
    # a pod starts, so installs from a checkout get main's newest, and others
    # only when missing.
    pullPolicy: ""
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # Log filter, in RUST_LOG syntax, e.g. "info,quake_kube_controller=debug".
  logLevel: info
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The master server runs in the controller. It lists the game servers for
# native Quake 3 clients' server browsers, using their external addresses.
master:
  port: 27950
  service:
    # Clients outside the cluster need to reach this, so it's a LoadBalancer
    # by default. Use NodePort or ClusterIP if native clients aren't needed.
    type: LoadBalancer
    annotations: {}

# The gateway serves the web app, which lists servers, creates them and runs
# the browser client. It relays browser clients' game traffic, so it runs
# separately from the controller.
gateway:
  replicas: 1
  # Log filter, in RUST_LOG syntax.
  logLevel: info
  # Namespace for servers created from the web app. Defaults to the release
  # namespace.
  namespace: ""
  # How many servers can be created from the web app at once. 0 turns
  # creating servers off. The web app has no login of its own, so put
  # authentication in front of it (e.g. in the ingress) if it's reachable by
  # people who shouldn't create servers.
  maxServers: 10
  # Delete the servers created from the web app when the chart is uninstalled,
  # which would otherwise keep running without the controller. Servers created
  # otherwise, e.g. with kubectl, are left alone.
  deleteServersOnUninstall: true
  # How many of those each person can have at once, when the gateway knows who
  # people are (see auth). Empty for no limit of their own.
  maxServersPerUser: null
  # Servers created from the web app are deleted after nobody has played on
  # them for this long, e.g. 30m or 2h, including servers that never started.
  # Empty keeps them until someone deletes them.
  idleTimeout: 30m
  # The games offered when creating a server. Each game type sets a type
  # (g_gametype, a name or a mod's number) and/or cvars, e.g. CPMA's
  # mode_start. spec is the start of each server's QuakeServer spec, e.g. a
  # mod's game.fsGame and content, where its maps must be. The server image
  # only has the Quake 3 demo maps.
  presets:
    - name: quake3
      title: Quake 3
      gameTypes:
        - {name: Free For All, type: FreeForAll}
        - {name: Tournament, type: Tournament}
        - {name: Team Deathmatch, type: TeamDeathmatch}
      maps:
        # The demo's, which every server has.
        - q3dm1
        - q3dm7
        - q3dm17
        - q3tourney2
        # Community maps from lvlworld. See the docs to ask for one to be removed.
        - lun3dm5
        - q3deck
        - lsdm1
        - estatica
        - rpg3dm2
        - chiropterata
        - pukka3tourney2
        - pukka3tourney5
        - pukka3dm1
        - pukka3tourney7
        - akutadm1
        - akutadm2
        - akutadm3
        - akutatourney5
        - akutatourney6
        - akutatourney8
        - bst3dm1
        - ct3tourney2
        - gas-st
        - jstrq3dm2
        - katdm3
        - wintergames
        - zl3tourney1
        - pjw3tourney1
        - hydra
        - goldleaf
        - q3gwdm2
        - phantq3dm4
        - phantq3dm3_rev
        - pom_bots
        - pasdm1
        - gs3dm5
        - jof3dm2
        - qxdm4_v2
        - ct3dm5
        - revenga
        - akutatourney3
        - akutatourney4
        - shad3dm2
        - ztn3tourney1
        - phantq3dm6_mc
        - q3gwdm1
        - moteof_final
        - trespass
      # Without image volumes, only the demo's maps are offered.
      # Lists of maps the web app offers to pick a rotation from.
      mapLists:
        - name: Quake 3 demo
          maps: [q3dm1, q3dm7, q3dm17, q3tourney2]
        - name: Duels
          maps: [q3tourney2, pukka3tourney2, pukka3tourney5, pukka3tourney7, akutatourney3, akutatourney4, akutatourney5, akutatourney6, akutatourney8, zl3tourney1, ct3tourney2, pjw3tourney1, ztn3tourney1]
      mapsWithoutImages: [q3dm1, q3dm7, q3dm17, q3tourney2]
      spec:
        content:
          - image: ghcr.io/chrisrx/quake-kube-quake3-maps:5
    - name: quake3-ctf
      title: Quake 3 CTF
      gameTypes:
        - {name: Capture The Flag, type: CaptureTheFlag}
      # Community maps with flags.
      maps: [nor3ctf1, phantq3ctf1_rev, ironwood]
      spec:
        content:
          - image: ghcr.io/chrisrx/quake-kube-quake3-maps:5
    - name: urban-terror
      title: Urban Terror 4.3
      bots: false
      gameTypes:
        - {name: Capture The Flag, type: 7}
        - {name: Team Deathmatch, type: 3}
        - {name: Team Survivor, type: 4}
        - {name: Free For All, type: 0}
        - {name: Bomb Mode, type: 8}
      maps:
