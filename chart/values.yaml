# Default values for quake-kube.

crds:
  # Install the CRDs with the chart. Disable when CRDs are managed separately.
  install: true
  # Keep the CRDs, and with them every QuakeServer, when the release is
  # uninstalled.
  keep: true

controller:
  image:
    repository: ghcr.io/chrisrx/quake-kube-controller
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # Log filter, in RUST_LOG syntax, e.g. "info,quake_kube_controller=debug".
  logLevel: info
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The master server runs in the controller. It lists the game servers for
# native Quake 3 clients' server browsers, using their external addresses.
master:
  port: 27950
  service:
    # Clients outside the cluster need to reach this, so it's a LoadBalancer
    # by default. Use NodePort or ClusterIP if native clients aren't needed.
    type: LoadBalancer
    annotations: {}

# The gateway serves the web app, which lists servers, creates them and runs
# the browser client. It relays browser clients' game traffic, so it runs
# separately from the controller.
gateway:
  replicas: 1
  # Log filter, in RUST_LOG syntax.
  logLevel: info
  # Namespace for servers created from the web app. Defaults to the release
  # namespace.
  namespace: ""
  # How many servers can be created from the web app at once. 0 turns
  # creating servers off. The web app has no login of its own, so put
  # authentication in front of it (e.g. in the ingress) if it's reachable by
  # people who shouldn't create servers.
  maxServers: 10
  # How many of those each person can have at once, when the gateway knows who
  # people are (see auth). Empty for no limit of their own.
  maxServersPerUser: null
  # The games offered when creating a server. Each game type sets a type
  # (g_gametype, a name or a mod's number) and/or cvars, e.g. CPMA's
  # mode_start. spec is the start of each server's QuakeServer spec, e.g. a
  # mod's game.fsGame and content, where its maps must be. The server image
  # only has the Quake 3 demo maps.
  presets:
    - name: quake3
      title: Quake 3
      gameTypes:
        - {name: Free For All, type: FreeForAll}
        - {name: Tournament, type: Tournament}
        - {name: Team Deathmatch, type: TeamDeathmatch}
        - {name: Capture The Flag, type: CaptureTheFlag}
      maps: [q3dm1, q3dm7, q3dm17, q3tourney2]
    - name: urban-terror
      title: Urban Terror 4.3
      bots: false
      gameTypes:
        - {name: Capture The Flag, type: 7}
        - {name: Team Deathmatch, type: 3}
        - {name: Team Survivor, type: 4}
        - {name: Free For All, type: 0}
        - {name: Bomb Mode, type: 8}
      maps:
        - ut4_turnpike
        - ut4_casa
        - ut4_abbey
        - ut4_algiers
        - ut4_austria
        - ut4_uptown
        - ut4_prague
        - ut4_kingdom
      spec:
        timeLimit: 20m
        game: {fsGame: q3ut4}
        content:
          - image: ghcr.io/chrisrx/quake-kube-urban-terror:4.3.4
    - name: cpma
      title: CPMA
      gameTypes:
        - {name: Free For All, cvars: {mode_start: FFA}}
        - {name: Duel, cvars: {mode_start: 1v1}}
        - {name: Team Deathmatch, cvars: {mode_start: TDM}}
        - {name: Clan Arena, cvars: {mode_start: CA}}
      # CPMA maps missing at most two textures without the full game.
      maps: [cpm22, cpm4a, cpm29, cpm28, cpm3a, cpm19, cpm20, cpm25, cpm27, cpm18r]
      spec:
        game: {fsGame: cpma}
        # Otherwise CPMA picks each map's mode from its own list.
        cvars: {server_useMapModes: "0"}
        content:
          - image: ghcr.io/chrisrx/quake-kube-cpma:1.53
  # Whether to offer the presets with content images, which need image
  # volumes: Kubernetes 1.35, or 1.33 with the ImageVolume feature gate. auto
  # offers them on 1.35 and later, true and false always or never do.
  imagePresets: auto
  # How the gateway knows who people are, so servers created from the web app
  # belong to whoever created them. It doesn't sign people in itself: a proxy
  # in front of it does.
  auth:
    # none: anyone who reaches the web app can use it, and servers have no
    #   owners.
    # iap: Google Cloud's Identity-Aware Proxy, whose signed assertion the
    #   gateway checks. See gke.iap.
    # header: another proxy that signs people in, e.g. oauth2-proxy, names
    #   them in a header. The gateway must only be reachable through it.
    mode: none
    iap:
      # The audience IAP signs its assertions for, e.g.
      # /projects/123/global/backendServices/456. GKE names the backend
      # service, so set projectNumber instead to accept any in the project.
      audience: ""
      projectNumber: ""
    header:
      # Header with the user's email address.
      user: X-Forwarded-Email
      # Header with the user's groups, separated by commas, e.g.
      # X-Forwarded-Groups, for admins bound by group.
      groups: ""
    # Admins can delete anyone's servers from the web app. They're whoever
    # RBAC lets delete QuakeServers in the web app's namespace, which these
    # users and groups are bound to.
    admins:
      users: []
      groups: []
    # Secret with a "key" that signs the tickets browsers open WebTransport
    # sessions with. When empty, each replica makes its own, so set it with
    # several replicas.
    ticketSecretName: ""
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  # A Gateway API route to the web app, as an alternative to the ingress.
  httpRoute:
    enabled: false
    annotations: {}
    # The Gateways it attaches to, e.g. [{name: external, namespace: infra}]
    parentRefs: []
    hostnames: []
  # GKE's load balancer settings for the gateway's Service, as a
  # GCPBackendPolicy for the httpRoute and a BackendConfig for the ingress.
  gke:
    enabled: false
    # How long browser clients' WebSockets can stay open, in seconds. GKE's
    # load balancers close them after 30 seconds otherwise.
    timeoutSec: 86400
    iap:
      # Signs people in with Google before they reach the web app. Needs
      # auth.mode iap.
      enabled: false
      # OAuth client IAP signs people in with. When empty, IAP uses a
      # Google-managed client, which only lets in people in your
      # organization.
      clientID: ""
      # Secret with the client's secret: in "key" for the httpRoute, and in
      # "client_id" and "client_secret" for the ingress.
      clientSecretName: ""
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # e.g. [{secretName: quake-kube-tls, hosts: [quake.example.com]}]
    tls: []
  # WebTransport carries browser clients' game traffic in unreliable
  # datagrams like native clients' UDP, avoiding the stalls TCP causes when
  # packets are lost. It runs over HTTP/3, so it needs its own UDP Service
  # rather than the ingress. Browsers only use it from HTTPS pages, and use a
  # WebSocket through the web app otherwise. It's off by default since
  # browsers need to reach it at publicAddress, or at the web app's hostname
  # when the Service shares the ingress's address.
  webtransport:
    enabled: false
    # Address browsers connect to, as host:port. When empty, browsers use the
    # web app's hostname with service.port, which works when this Service
    # shares the ingress's IP address.
    publicAddress: ""
    service:
      type: LoadBalancer
      port: 443
      # e.g. to share the ingress controller's MetalLB address:
      #   metallb.io/allow-shared-ip: <same key as the ingress Service>
      #   metallb.io/loadBalancerIPs: <the ingress Service's IP>
      annotations: {}
    tls:
      # Secret with a tls.crt and tls.key that browsers trust, e.g. from
      # cert-manager. When empty, each gateway replica uses its own
      # self-signed certificate, which browsers accept by its hash. Browsers
      # only allow that for certificates valid up to 14 days, so it's replaced
      # every 10 days. With several replicas, use a Secret, since a page may
      # get one replica's hash and reach another.
      secretName: ""
  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Settings for the game servers the controller creates from QuakeServer
# objects.
gameServers:
  image:
    repository: ghcr.io/chrisrx/quake-kube-server
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
  # How native Quake 3 clients reach game servers. Browser clients don't need
  # this, they connect over HTTP.
  exposure:
    # LoadBalancer: a UDP LoadBalancer Service per server.
    # NodePort:     a UDP NodePort Service per server.
    # HostPort:     the game port is bound on the node running the server.
    # None:         only reachable from inside the cluster.
    type: LoadBalancer
    # Added to each server's LoadBalancer or NodePort Service, e.g. to request
    # a UDP load balancer from a cloud provider, or to share one MetalLB
    # address between servers:
    #   metallb.io/allow-shared-ip: quake-kube
    #   metallb.io/loadBalancerIPs: 172.28.0.150
    annotations: {}
    # Allocate each server its own external port from this range, e.g.
    # "27960-27999". Required when servers share an address. With NodePort the
    # range must be inside the cluster's NodePort range. When empty, servers
    # use 27960, or a NodePort chosen by Kubernetes.
    portRange: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
