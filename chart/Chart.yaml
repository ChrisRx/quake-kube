apiVersion: v2
name: quake-kube
description: A Helm chart for Quake Kube

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Every push to main publishes the chart with this version, replacing the
# published one (see .github/workflows/push-image.yaml).
version: 0.1.0

# The tag of the images the chart deploys by default: latest, the images built
# from main. CI adds the commit to the published chart's annotations, which
# the pods carry, so helm upgrade restarts them with the newest images.
appVersion: "latest"
