# Local cluster for development. Created by `task cluster` (hack/dev.sh up).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: quake-kube
servers: 1
# Agents let you check that game servers on different nodes stay reachable.
agents: 2
image: rancher/k3s:v1.35.9-k3s1
# Fixed so the MetalLB pool and Traefik address are predictable. Override with
# K3D_SUBNET if it collides with a network on your machine.
subnet: 172.28.0.0/24
# Created by hack/dev.sh rather than by k3d, which assumes Docker's "bridge"
# network and fails on podman.
registries:
  use:
    - k3d-quake-kube-registry:5005
options:
  k3s:
    extraArgs:
      # MetalLB replaces k3s's ServiceLB so LoadBalancer Services get their own
      # IPs like they would from a cloud provider.
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
