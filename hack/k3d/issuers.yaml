# Certificates from the local-ca ClusterIssuer chain to the local CA in the
# local-ca Secret, which can be trusted in a browser for HTTPS and WebTransport
# testing. hack/dev.sh fills the Secret with mkcert's CA when there is one,
# which browsers already trust after `task ui:trust`, and otherwise creates a
# CA for the cluster (local-ca.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
spec:
  ca:
    secretName: local-ca
