# The chart's presets, with content images the Tiltfile builds and pushes to
# the cluster's registry.
gateway:
  presets:
    - name: quake3
      title: Quake 3
      gameTypes:
        - {name: Free For All, type: FreeForAll}
        - {name: Tournament, type: Tournament}
        - {name: Team Deathmatch, type: TeamDeathmatch}
      maps:
        # The demo's, which every server has.
        - q3dm1
        - q3dm7
        - q3dm17
        - q3tourney2
        # Community maps from lvlworld. See the docs to ask for one to be removed.
        - lun3dm5
        - q3deck
        - lsdm1
        - estatica
        - rpg3dm2
        - chiropterata
        - pukka3tourney2
        - pukka3tourney5
        - pukka3dm1
        - pukka3tourney7
        - akutadm1
        - akutadm2
        - akutadm3
        - akutatourney5
        - akutatourney6
        - akutatourney8
        - bst3dm1
        - ct3tourney2
        - gas-st
        - jstrq3dm2
        - katdm3
        - wintergames
        - zl3tourney1
        - pjw3tourney1
        - hydra
        - goldleaf
        - q3gwdm2
        - phantq3dm4
        - phantq3dm3_rev
        - pom_bots
        - pasdm1
        - gs3dm5
        - jof3dm2
        - qxdm4_v2
        - ct3dm5
        - revenga
        - akutatourney3
        - akutatourney4
        - shad3dm2
        - ztn3tourney1
        - phantq3dm6_mc
        - q3gwdm1
        - moteof_final
        - trespass
      # Without image volumes, only the demo's maps are offered.
      # Lists of maps the web app offers to pick a rotation from.
      mapLists:
        - name: Quake 3 demo
          maps: [q3dm1, q3dm7, q3dm17, q3tourney2]
        - name: Duels
          maps: [q3tourney2, pukka3tourney2, pukka3tourney5, pukka3tourney7, akutatourney3, akutatourney4, akutatourney5, akutatourney6, akutatourney8, zl3tourney1, ct3tourney2, pjw3tourney1, ztn3tourney1]
      mapsWithoutImages: [q3dm1, q3dm7, q3dm17, q3tourney2]
      spec:
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-quake3-maps:6
    - name: quake3-ctf
      title: Quake 3 CTF
      gameTypes:
        - {name: Capture The Flag, type: CaptureTheFlag}
      # Community maps with flags.
      maps: [nor3ctf1, phantq3ctf1_rev, ironwood]
      spec:
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-quake3-maps:6
    - name: urban-terror
      title: Urban Terror 4.3
      bots: false
      gameTypes:
        - {name: Capture The Flag, type: 7}
        - {name: Team Deathmatch, type: 3}
        - {name: Team Survivor, type: 4}
        - {name: Free For All, type: 0}
        - {name: Bomb Mode, type: 8}
      maps:
        - ut4_turnpike
        - ut4_casa
        - ut4_abbey
        - ut4_algiers
        - ut4_austria
        - ut4_uptown
        - ut4_prague
        - ut4_kingdom
        - ut4_paris
        - ut4_kingpin
        - ut4_riyadh
        - ut4_eagle
        # A community map, by Kr0t4L.
        - ut4_orbital_sl
      spec:
        timeLimit: 20m
        game: {fsGame: q3ut4}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-urban-terror:4.3.4
    - name: cpma
      title: CPMA
      gameTypes:
        - {name: Free For All, cvars: {mode_start: FFA}, arena: ffa}
        - {name: Duel, cvars: {mode_start: 1v1}, arena: tourney}
        - {name: Team Deathmatch, cvars: {mode_start: TDM}, arena: team}
        - {name: Clan Arena, cvars: {mode_start: CA}}
      # CPMA maps missing at most one texture without the full game, with
      # stand-ins from OpenArena.
      maps: [cpm22, cpm4a, cpm29, cpm28, cpm3a, cpm19, cpm20, cpm25, cpm27, cpm18r, cpm23, cpm24]
      spec:
        game: {fsGame: cpma}
        # Otherwise CPMA picks each map's mode from its own list.
        cvars: {server_useMapModes: "0"}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-cpma:1.53
    - name: rocket-arena
      title: Rocket Arena
      gameTypes:
        - {name: Clan Arena, cvars: {mode_start: CA}}
      # Rocket Arena 3's maps on CPMA, whose Clan Arena is Rocket Arena's
      # game mode. The rest of RA3's maps miss too many of the full game's
      # textures.
      maps: [ra3map12, ra3map17, ra3map18, ra3map9, ra3map20, ra3map16]
      spec:
        game: {fsGame: cpma}
        cvars: {server_useMapModes: "0"}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-cpma:1.53
          - image: k3d-quake-kube-registry:5000/quake-kube-rocket-arena:1.76
    - name: rocket-arena-3
      title: Rocket Arena 3
      bots: false
      gameTypes:
        # Each arena's game type is in the map's own config.
        - {name: Arenas}
      maps: [ra3map12, ra3map17, ra3map18, ra3map9, ra3map20, ra3map16]
      spec:
        # RA3's game code is only a 32-bit x86 library, so the server runs it
        # natively, on x86-64 nodes.
        game: {fsGame: arena, native: true}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-rocket-arena:1.76
    - name: ufreeze
      title: Ultra Freeze Tag
      gameTypes:
        # Freeze tag is a team game: frozen players are thawed by teammates.
        - {name: Team Freeze, type: TeamDeathmatch}
        - {name: Team Freeze With Grappling Hook, type: TeamDeathmatch, cvars: {g_grapple: "1"}}
      maps:
        - q3dm1
        - q3dm7
        - q3dm17
        - q3tourney2
        - lun3dm5
        - q3deck
        - lsdm1
        - estatica
        - rpg3dm2
        - chiropterata
        - pukka3tourney2
        - pukka3tourney5
        - pukka3dm1
        - pukka3tourney7
        - akutadm1
        - akutadm2
        - akutadm3
        - akutatourney5
        - akutatourney6
        - akutatourney8
        - bst3dm1
        - ct3tourney2
        - gas-st
        - jstrq3dm2
        - katdm3
        - wintergames
        - zl3tourney1
        - pjw3tourney1
        - hydra
        - goldleaf
        - q3gwdm2
        - phantq3dm4
        - phantq3dm3_rev
        - pom_bots
        - pasdm1
        - gs3dm5
        - jof3dm2
        - qxdm4_v2
        - ct3dm5
        - revenga
        - akutatourney3
        - akutatourney4
        - shad3dm2
        - ztn3tourney1
        - phantq3dm6_mc
        - q3gwdm1
        - moteof_final
        - trespass
      spec:
        game: {fsGame: ufreeze}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-ufreeze:1.21
          - image: k3d-quake-kube-registry:5000/quake-kube-quake3-maps:6
    - name: defrag
      title: DeFRaG
      # A racing and trick jumping mod, so it has no bots. Its
      # "game types" choose the physics, Quake 3's or CPMA's.
      bots: false
      gameTypes:
        - {name: Vanilla Physics, cvars: {df_promode: "0"}}
        - {name: CPM Physics, cvars: {df_promode: "1"}}
      # The test maps DeFRaG ships with.
      maps: [df-weapon1, df-shooter1, df-velopad1, df-black, df-black-grid]
      spec:
        game: {fsGame: defrag}
        cvars: {pmove_fixed: "1"}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-defrag:1.91.31
    - name: openarena
      title: OpenArena
      gameTypes:
        - {name: Free For All, type: 0, arena: ffa}
        - {name: Tournament, type: 1, arena: tourney}
        - {name: Team Deathmatch, type: 3, arena: team}
        - {name: Elimination, type: 8}
        - {name: Last Man Standing, type: 10}
      maps:
        - aggressor
        - oa_rpg3dm2
        - oa_dm4
        - czest1dm
        - am_galmevish2
        - wrackdm17
        - oa_shouse
        - am_underworks2
        - oa_koth2
        - kaos2
        # The OpenArena Community Mappack.
        - oacmpdm1
        - oacmpdm3
        - oacmpdm5
        - oacmpdm8
        - oacmpdm9
        # Quake 3's demo maps, and the community maps, which OpenArena plays with its
        # own models and rules. Native OpenArena clients don't have the demo's
        # files, but browsers download them.
        - q3dm1
        - q3dm7
        - q3dm17
        - q3tourney2
        - lun3dm5
        - q3deck
        - lsdm1
        - estatica
        - rpg3dm2
        - chiropterata
        - pukka3tourney2
        - pukka3tourney5
        - pukka3dm1
        - pukka3tourney7
        - akutadm1
        - akutadm2
        - akutadm3
        - akutatourney5
        - akutatourney6
        - akutatourney8
        - bst3dm1
        - ct3tourney2
        - gas-st
        - jstrq3dm2
        - katdm3
        - wintergames
        - zl3tourney1
        - pjw3tourney1
        - hydra
        - goldleaf
        - q3gwdm2
        - phantq3dm4
        - phantq3dm3_rev
        - pom_bots
        - pasdm1
        - gs3dm5
        - jof3dm2
        - qxdm4_v2
        - ct3dm5
        - revenga
        - akutatourney3
        - akutatourney4
        - shad3dm2
        - ztn3tourney1
        - phantq3dm6_mc
        - q3gwdm1
        - moteof_final
        - trespass
      spec:
        game: {fsGame: baseoa}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-openarena:0.8.8
          - image: k3d-quake-kube-registry:5000/quake-kube-quake3-maps:6
    - name: openarena-ctf
      title: OpenArena CTF
      gameTypes:
        - {name: Capture The Flag, type: 4, arena: ctf}
        - {name: One Flag CTF, type: 5, arena: oneflag}
        - {name: Overload, type: 6, arena: overload}
        - {name: Harvester, type: 7, arena: harvester}
        - {name: CTF Elimination, type: 9, arena: ctf}
        - {name: Double Domination, type: 11}
      maps:
        - oasago2
        - ps37ctf2
        - oa_ctf4ish
        - am_thornish
        - delta
        - oa_bases7
        - czest3ctf
        - am_lavactf
        # The OpenArena Community Mappack.
        - oacmpctf1
        - oacmpctf2
        - oacmpctf3
        - oacmpdm6
        - oacmpdm10
        # Quake 3 community maps with flags.
        - nor3ctf1
        - phantq3ctf1_rev
        - ironwood
      spec:
        game: {fsGame: baseoa}
        content:
          - image: k3d-quake-kube-registry:5000/quake-kube-openarena:0.8.8
          - image: k3d-quake-kube-registry:5000/quake-kube-quake3-maps:6
