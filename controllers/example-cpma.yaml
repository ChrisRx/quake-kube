# Challenge ProMode Arena (https://playmorepromode.com) on the Quake 3 demo content. CPMA's
# default player model is only in the full game, so the content image includes a stand-in
# from OpenArena (see content/cpma).
apiVersion: quake.kube/v1
kind: QuakeServer
metadata:
  name: cpma
spec:
  timeLimit: 15m
  bot:
    minPlayers: 3
  game:
    fsGame: cpma
  server:
    hostname: cpma
    maxClients: 12
  # CPMA ignores g_gametype and plays the mode in mode_start, e.g. FFA, 1v1, TDM or CTF,
  # unless server_useMapModes has it pick each map's mode from its own list.
  cvars:
    mode_start: FFA
    server_useMapModes: "0"
  content:
    # CPMA, its map pack and the stand-in model, from a content image built from
    # content/cpma.
    - image: ghcr.io/chrisrx/quake-kube-cpma:1.53
    # Downloading them when the server starts works too. The map pack's pk3s are at the
    # top of its archive.
    # - url: https://cdn.playmorepromode.com/files/cpma/cpma-1.53-nomaps.zip
    #   sha256: edfffa0c1a0375ba46a5b42257a168fb15086712245733526ab2d9ccdd821ca0
    # - url: https://cdn.playmorepromode.com/files/cpma-mappack-full.zip
    #   sha256: 5db933fc92c41f2e0941ab65725586d4d0c30fe84727427bb6b265e4d941a226
    #   dir: cpma
  # Maps missing few or no textures without the full game.
  maps:
    - name: cpm22
    - name: cpm4a
    - name: cpm29
