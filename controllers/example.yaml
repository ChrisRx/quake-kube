apiVersion: quake.kube/v1
kind: QuakeServer
metadata:
  name: quake-kube
spec:
  fragLimit: 25
  timeLimit: 15m
  bot:
    minPlayers: 3
  game:
    type: FreeForAll
    motd: "Welcome to Quake Kube"
    forceRespawn: false
    inactivity: 10m
    quadFactor: 3
    weaponRespawn: 3
  server:
    hostname: quakekube
    maxClients: 12
  commands:
    - addbot sarge 2
  # Only maps in the Quake 3 demo content, which is all the server image has.
  maps:
    - name: q3dm7
      type: FreeForAll
      timeLimit: 10m
    - name: q3dm17
      type: FreeForAll
    - name: q3dm1
      type: FreeForAll
    - name: q3tourney2
      type: Tournament
