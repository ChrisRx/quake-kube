<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quake Kube</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f0e0c'/%3E%3Cpath d='M4 13 12 3' stroke='%23e0562b' stroke-width='3'/%3E%3C/svg%3E">
    <style>
      :root {
        --bg: #0f0e0c;
        --panel: #181613;
        --line: #2e2924;
        --text: #e8e2d9;
        --muted: #9a9086;
        --accent: #e0562b;
        --accent-strong: #c2421c;
        --ok: #7dbb5a;
        --wait: #d9a441;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        font: 15px/1.45 system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font: 700 22px/1 var(--mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 span {
        color: var(--accent);
      }
      h2 {
        margin: 32px 0 12px;
        font: 600 12px/1 var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .count {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px 18px;
        font: 13px var(--mono);
        color: var(--muted);
      }
      .servers {
        display: grid;
        gap: 8px;
      }
      .server {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px 24px;
        align-items: center;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 3px solid var(--line);
      }
      .server.ready {
        border-left-color: var(--accent);
      }
      .server .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 17px;
        overflow-wrap: anywhere;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--wait);
      }
      .ready .dot {
        background: var(--ok);
      }
      .details {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-top: 6px;
        font: 13px var(--mono);
        color: var(--muted);
      }
      .details b {
        font-weight: 500;
        color: var(--text);
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button,
      .button {
        display: inline-block;
        padding: 9px 16px;
        font: 600 13px/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: #fff;
        background: var(--accent-strong);
        border: 1px solid transparent;
        cursor: pointer;
      }
      button:hover,
      .button:hover {
        background: var(--accent);
      }
      .button.disabled {
        pointer-events: none;
        opacity: 0.4;
      }
      button.secondary {
        color: var(--muted);
        background: transparent;
        border-color: var(--line);
      }
      button.secondary:hover {
        color: var(--text);
        border-color: var(--muted);
        background: transparent;
      }
      .empty {
        padding: 24px 16px;
        color: var(--muted);
        border: 1px dashed var(--line);
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      label {
        display: grid;
        gap: 6px;
        font: 12px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input,
      select {
        width: 100%;
        padding: 9px 10px;
        font: 15px system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 0;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      form .submit {
        display: flex;
        align-items: end;
      }
      form .submit button {
        width: 100%;
      }
      .error {
        grid-column: 1 / -1;
        margin: 0;
        color: var(--accent);
      }
      .error:empty {
        display: none;
      }
      .hint {
        margin: 32px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      code {
        font-family: var(--mono);
        color: var(--text);
      }
      @media (max-width: 560px) {
        .server {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Quake<span>/</span>Kube</h1>
        <div class="count"><span id="user"></span><span id="count"></span></div>
      </header>

      <h2>Servers</h2>
      <div class="servers" id="servers"></div>

      <section id="create" hidden>
        <h2>New server</h2>
        <form id="create-form">
          <label>Name <input name="name" required pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" maxlength="40" placeholder="friday-night"></label>
          <label>Game <select name="preset" id="presets"></select></label>
          <label>Mode <select name="gameType" id="game-types"></select></label>
          <label>Map <select name="map" id="maps"></select></label>
          <label id="bots">Bots <input name="bots" type="number" min="0" max="16" value="2"></label>
          <label>Password <input name="password" type="password" placeholder="Optional"></label>
          <div class="submit"><button type="submit">Create</button></div>
          <p class="error" id="create-error"></p>
        </form>
      </section>

      <p class="hint">Native Quake 3 clients can connect to a server's address directly.</p>
    </main>

    <template id="server-template">
      <div class="server">
        <div>
          <div class="title"><span class="dot"></span><span class="name"></span></div>
          <div class="details"></div>
        </div>
        <div class="actions">
          <a class="button play">Play</a>
          <button class="secondary delete" hidden>Delete</button>
        </div>
      </div>
    </template>

    <script>
      const serversEl = document.getElementById("servers");
      const template = document.getElementById("server-template");

      function detail(label, value) {
        const span = document.createElement("span");
        span.append(label + " ");
        const b = document.createElement("b");
        b.textContent = value;
        span.append(b);
        return span;
      }

      function render(servers) {
        document.getElementById("count").textContent =
          `${servers.filter((s) => s.ready).length} of ${servers.length} running`;
        if (servers.length === 0) {
          serversEl.innerHTML = '<div class="empty">No servers yet.</div>';
          return;
        }
        serversEl.replaceChildren(
          ...servers.map((s) => {
            const el = template.content.firstElementChild.cloneNode(true);
            el.classList.toggle("ready", s.ready);
            el.querySelector(".name").textContent = s.hostname || s.name;
            const details = el.querySelector(".details");
            if (!s.ready) {
              details.append(detail("status", "starting"));
            } else {
              if (s.game) details.append(detail("game", s.game));
              if (s.map) details.append(detail("map", s.map));
              if (s.gameType) details.append(detail("mode", s.gameType));
              if (s.humans != null) {
                const bots = s.bots ? ` +${s.bots} bots` : "";
                details.append(detail("players", `${s.humans}/${s.maxPlayers}${bots}`));
              }
              if (s.address) details.append(detail("address", s.address));
              if (s.needsPassword) details.append(detail("password", "yes"));
            }
            if (s.owner) details.append(detail("owner", s.owner));
            const play = el.querySelector(".play");
            play.href = `/play/${s.namespace}/${s.name}/`;
            play.classList.toggle("disabled", !s.ready || s.map == null);
            const del = el.querySelector(".delete");
            del.hidden = !s.deletable;
            del.addEventListener("click", async () => {
              if (!confirm(`Delete ${s.name}? Anyone playing will be disconnected.`)) return;
              const response = await fetch(`/api/servers/${s.namespace}/${s.name}`, { method: "DELETE" });
              if (!response.ok) alert((await response.text()) || "Deleting the server failed.");
              refresh();
            });
            return el;
          }),
        );
      }

      async function refresh() {
        try {
          const response = await fetch("/api/servers");
          if (response.ok) render(await response.json());
        } catch {}
      }

      let presets = [];

      // Offers the chosen game's modes and maps.
      function showPreset() {
        const preset = presets.find((p) => p.name === document.getElementById("presets").value);
        document.getElementById("game-types").replaceChildren(
          ...preset.gameTypes.map((name) => new Option(name, name)),
        );
        document.getElementById("maps").replaceChildren(
          ...preset.maps.map((map) => new Option(map, map)),
        );
        const bots = document.getElementById("bots");
        bots.hidden = !preset.bots;
        bots.querySelector("input").disabled = !preset.bots;
      }

      async function setUpCreate() {
        const config = await (await fetch("/api/config")).json();
        if (config.user) document.getElementById("user").textContent = config.user;
        if (!config.canCreate) return;
        presets = config.presets;
        const select = document.getElementById("presets");
        select.replaceChildren(...presets.map((p) => new Option(p.title, p.name)));
        select.addEventListener("change", showPreset);
        showPreset();
        document.getElementById("create").hidden = false;
      }

      document.getElementById("create-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.target;
        const error = document.getElementById("create-error");
        const data = Object.fromEntries(new FormData(form));
        data.bots = Number(data.bots ?? 0);
        const response = await fetch("/api/servers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (response.ok) {
          error.textContent = "";
          form.reset();
          showPreset();
          refresh();
        } else {
          error.textContent = (await response.text()) || "Creating the server failed.";
        }
      });

      setUpCreate();
      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
