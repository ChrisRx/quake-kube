<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{NAME}} · Quake Kube</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 1.5 22 7.25 12 13 2 7.25Z' fill='%23f08a62'/%3E%3Cpath d='M2 7.25 12 13v10.5L2 17.75Z' fill='%23e0562b'/%3E%3Cpath d='M22 7.25v10.5L12 23.5V13Z' fill='%23c2421c'/%3E%3C/svg%3E">
    <style>
      [hidden] {
        display: none !important;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0f0e0c;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #join,
      #pause {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 15px/1.4 system-ui, sans-serif;
        color: #e8e2d9;
      }
      #join form,
      #pause .panel {
        display: grid;
        gap: 12px;
        width: min(340px, calc(100vw - 32px));
        padding: 24px;
        background: rgba(12, 11, 10, 0.92);
        border: 1px solid #3a332c;
      }
      #join h1,
      #pause h1 {
        margin: 0 0 4px;
        font: 600 13px/1 ui-monospace, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #e0562b;
      }
      #join input:not([type="checkbox"]) {
        padding: 10px 12px;
        font: inherit;
        color: inherit;
        background: #1b1916;
        border: 1px solid #3a332c;
      }
      #join input:focus {
        outline: 2px solid #e0562b;
        outline-offset: -1px;
      }
      #join label {
        display: flex;
        gap: 8px;
        align-items: start;
        font-size: 13px;
        color: #a39a8f;
      }
      #join button,
      #pause button {
        padding: 10px;
        font: 600 14px/1 system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fff;
        background: #c2421c;
        border: 0;
        cursor: pointer;
      }
      #join button:hover,
      #pause button:hover {
        background: #e0562b;
      }
      #join button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #join a {
        color: #a39a8f;
        font-size: 13px;
        text-align: center;
      }
      #pause {
        background: rgba(12, 11, 10, 0.5);
        cursor: pointer;
      }
      #pause .panel {
        cursor: default;
      }
      #pause button.secondary {
        color: #a39a8f;
        background: transparent;
        border: 1px solid #3a332c;
      }
      #pause button.secondary:hover {
        color: #e8e2d9;
        border-color: #a39a8f;
      }
      #pause p {
        margin: 0;
        font-size: 13px;
        color: #a39a8f;
      }
      #status {
        margin: 0;
        font: 13px ui-monospace, monospace;
        color: #e8e2d9;
      }
      #status:empty,
      #download:empty {
        display: none;
      }
      #download {
        margin: 0;
        font-size: 13px;
        color: #a39a8f;
      }
      #download .warning {
        display: block;
        margin-top: 4px;
        color: #d9a441;
      }
      /* Waiting for the server to come back after switching games, in place of the game. */
      #join.waiting form > :not(h1, #status, a) {
        display: none !important;
      }
      #join.waiting #status::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 10px;
        border: 2px solid #3a332c;
        border-top-color: #e0562b;
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* The owner's server settings, over the pause menu. */
      #pause .panel.settings {
        box-sizing: border-box;
        width: min(640px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }
      .settings form {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }
      .settings .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .settings label,
      .settings .field-label {
        display: grid;
        gap: 6px;
        font: 11px ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a39a8f;
      }
      .settings select,
      .settings input {
        width: 100%;
        min-width: 0;
        padding: 9px 10px;
        font: 15px system-ui, sans-serif;
        color: #e8e2d9;
        background: #1b1916;
        border: 1px solid #3a332c;
        border-radius: 0;
      }
      .settings select:focus,
      .settings input:focus {
        outline: 2px solid #e0562b;
        outline-offset: -1px;
      }
      .settings input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
        text-align: center;
      }
      .settings input[type="number"]::-webkit-inner-spin-button,
      .settings input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .settings .stepper {
        display: flex;
      }
      #pause .settings .stepper button {
        flex: none;
        width: 36px;
        padding: 0;
        font: 18px/1 ui-monospace, monospace;
        letter-spacing: 0;
        color: #a39a8f;
        background: #1b1916;
        border: 1px solid #3a332c;
      }
      #pause .settings .stepper button:hover {
        color: #e8e2d9;
        background: #3a332c;
      }
      .settings .stepper button:first-child {
        border-right: 0;
      }
      .settings .stepper button:last-child {
        border-left: 0;
      }
      .settings .maps {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        /* Tiles keep their size, scrolling rather than shrinking when there are many. */
        grid-auto-rows: max-content;
        gap: 8px;
        max-height: 268px;
        overflow-y: auto;
      }
      #pause .settings .map {
        display: grid;
        gap: 0;
        padding: 0;
        font: 12px/1 ui-monospace, monospace;
        letter-spacing: 0;
        text-transform: none;
        color: #e8e2d9;
        background: #1b1916;
        border: 1px solid #3a332c;
        overflow: hidden;
      }
      #pause .settings .map:hover {
        border-color: #a39a8f;
        background: #1b1916;
      }
      #pause .settings .map[aria-pressed="true"] {
        border-color: #e0562b;
        outline: 1px solid #e0562b;
      }
      .settings .map .shot {
        aspect-ratio: 4 / 3;
        background: #26221e center / cover no-repeat;
      }
      /* A map whose pak has no levelshot. */
      .settings .map .shot.missing {
        display: grid;
        place-items: center;
        background: repeating-linear-gradient(135deg, #221f1b 0 8px, #1b1916 8px 16px);
      }
      .settings .map .shot.missing::after {
        content: "No picture";
        font: 11px ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6f675e;
      }
      .settings .map span {
        padding: 6px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .settings .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      #pause .settings .actions button {
        padding: 10px 18px;
      }
      #pause .settings button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #pause .settings .warning {
        color: #d9a441;
      }
      #pause .settings .error {
        color: #e5675c;
      }
      #pause .settings p:empty {
        display: none;
      }
      #notice {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 32px);
        padding: 10px 16px;
        font: 14px system-ui, sans-serif;
        color: #e8e2d9;
        background: rgba(12, 11, 10, 0.92);
        border: 1px solid #3a332c;
        border-top: 2px solid #e0562b;
      }
    </style>
    <script>
      const server = {
        namespace: "{{NAMESPACE}}",
        name: "{{NAME}}",
        needsPassword: {{NEEDS_PASSWORD}},
        // The maps it rotates through.
        maps: {{MAPS}},
      };
      const base = `/play/${server.namespace}/${server.name}`;
      const clientVersion = "{{CLIENT_VERSION}}";
      // Whether the client can read paks on demand, which needs the gateway's JSPI build and a
      // browser with JSPI.
      const onDemand = {{ON_DEMAND}} && "Suspending" in WebAssembly;

      // Where the gateway accepts WebTransport sessions, or null when it doesn't.
      const webTransport = {{WEBTRANSPORT}};

      // From the signed-in user's email address, for people who haven't chosen a name.
      const suggestedName = {{SUGGESTED_NAME}};

      // The server's settings and the games it can switch to, when the viewer can change them.
      const manage = {{MANAGE}};
    </script>
    <script src="/static/gamesocket.js"></script>
    <script src="/static/paks.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="join">
      <form>
        <h1>{{NAME}}</h1>
        <input id="player-name" placeholder="Player name" autocomplete="nickname" maxlength="32">
        <input id="password" type="password" placeholder="Server password" hidden>
        <label id="voice-row" hidden>
          <input id="voice" type="checkbox">
          <span>Voice chat, which uses your microphone</span>
        </label>
        <p id="download"></p>
        <label id="eula-row">
          <input id="eula" type="checkbox">
          <span>I agree to the <a href="/static/eula.txt" target="_blank">Quake 3 demo license</a>, which covers the game files this downloads.</span>
        </label>
        <button type="submit">Join</button>
        <p id="status"></p>
        <a href="/">Back to servers</a>
      </form>
    </div>
    <div id="pause" hidden>
      <div class="panel" id="pause-menu">
        <h1 id="pause-title">Ready</h1>
        <button id="resume">Play</button>
        <button id="fullscreen" class="secondary">Full screen</button>
        <button id="open-settings" class="secondary" hidden>Server settings</button>
        <button id="leave" class="secondary">Leave server</button>
        <p id="pause-hint">Esc opens the game's menu.</p>
      </div>
      <div class="panel settings" id="settings" hidden>
        <h1>Server settings</h1>
        <form id="settings-form">
          <div class="fields">
            <label>Game <select name="preset" id="s-preset"></select></label>
            <label>Mode <select name="gameType" id="s-mode"></select></label>
          </div>
          <p class="warning" id="s-switch"></p>
          <div class="field-label" id="s-maps-label">Map
            <div class="maps" id="s-maps" role="group" aria-labelledby="s-maps-label"></div>
          </div>
          <div class="fields">
            <label id="s-bots">Bots <input name="bots" type="number" min="0" max="16" inputmode="numeric"></label>
            <label>Frag limit <input name="fragLimit" type="number" min="1" max="999" placeholder="Default" inputmode="numeric" data-step="5" data-start="20"></label>
            <label>Time limit, min <input name="timeLimit" type="number" min="1" max="999" placeholder="Default" inputmode="numeric" data-step="5" data-start="10"></label>
            <label>Capture limit <input name="captureLimit" type="number" min="1" max="999" placeholder="Default" inputmode="numeric" data-start="8"></label>
            <label>Max players <input name="maxPlayers" type="number" min="1" max="64" placeholder="Default" inputmode="numeric" data-start="8"></label>
          </div>
          <p id="s-note">Changes apply right away and reload the map. Players stay connected.</p>
          <p class="error" id="s-error" aria-live="polite"></p>
          <div class="actions">
            <button type="button" class="secondary" id="s-back">Back</button>
            <button type="submit" id="s-apply">Apply</button>
          </div>
        </form>
      </div>
    </div>
    <div id="notice" role="status" hidden></div>

    <script type="module">
      const form = document.querySelector("#join form");
      const nameInput = document.getElementById("player-name");
      const passwordInput = document.getElementById("password");
      const eulaInput = document.getElementById("eula");
      const statusText = document.getElementById("status");
      const setStatus = (text) => (statusText.textContent = text);

      function stored(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }
      function store(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {}
      }

      nameInput.value = stored("playerName") || suggestedName || "";

      // Voice chat is offered when the server has it, and remembered.
      const voiceInput = document.getElementById("voice");
      voiceInput.checked = stored("voiceChat") === "yes";
      fetch(`${base}/info`)
        .then((response) => response.json())
        .then((info) => (document.getElementById("voice-row").hidden = !info.voip))
        .catch(() => {});

      // The engine captures the mouse as soon as it can, before the player could click anything
      // else, like the browser's own prompts. It only gets the mouse once the player clicks to
      // play, and losing it, e.g. to Esc, pauses with a menu.
      const canvas = document.getElementById("canvas");
      const pause = document.getElementById("pause");
      const lockPointer = canvas.requestPointerLock.bind(canvas);
      let pointerAllowed = false;
      let playing = false;

      function showPause() {
        closeSettings();
        document.getElementById("pause-title").textContent = playing ? "Paused" : "Ready";
        document.getElementById("resume").textContent = playing ? "Resume" : "Play";
        document.getElementById("pause-hint").textContent = "Esc opens the game's menu.";
        pause.hidden = false;
      }

      function resume() {
        pointerAllowed = true;
        // Browsers refuse the mouse for a moment after the player takes it back.
        Promise.resolve(lockPointer()).catch(() => {
          document.getElementById("pause-hint").textContent = "Click again in a moment.";
        });
      }

      canvas.requestPointerLock = (...args) => {
        if (pointerAllowed) return lockPointer(...args);
        showPause();
      };
      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement === canvas) {
          playing = true;
          pause.hidden = true;
        } else if (playing) {
          pointerAllowed = false;
          showPause();
        }
      });
      // A click anywhere outside the menu plays too, unless the owner is changing settings.
      const settingsPanel = document.getElementById("settings");
      pause.addEventListener("click", (event) => {
        if (event.target === pause && settingsPanel.hidden) resume();
      });
      document.getElementById("resume").addEventListener("click", resume);
      // The whole page goes full screen rather than the engine's canvas, so this menu still
      // shows over the game.
      document.getElementById("fullscreen").addEventListener("click", async () => {
        if (document.fullscreenElement) await document.exitFullscreen().catch(() => {});
        else await document.documentElement.requestFullscreen().catch(() => {});
        resume();
      });
      document.getElementById("leave").addEventListener("click", () => (location.href = "/"));
      // While paused, keys don't reach the game, except Esc, which opens the game's menu.
      for (const type of ["keydown", "keypress", "keyup"]) {
        window.addEventListener(
          type,
          (event) => {
            // The settings' fields get the keys, and Esc goes back to the menu.
            if (!pause.hidden && !settingsPanel.hidden) {
              event.stopImmediatePropagation();
              if (type === "keydown" && event.key === "Escape") closeSettings();
              return;
            }
            if (pause.hidden || event.key === "Escape") {
              if (!pause.hidden && type === "keydown") {
                pause.hidden = true;
                pointerAllowed = true;
              }
              return;
            }
            event.stopImmediatePropagation();
            if (type === "keydown" && (event.key === "Enter" || event.key === " ")) resume();
          },
          true,
        );
      }
      // The owner's settings, which change the server while everyone plays.
      const settingsForm = document.getElementById("settings-form");
      const presetSelect = document.getElementById("s-preset");
      const pauseMenu = document.getElementById("pause-menu");
      let chosenMap = null;

      function closeSettings() {
        settingsPanel.hidden = true;
        pauseMenu.hidden = false;
      }

      // Puts − and + buttons around a number field, like the web app's.
      function addStepper(input) {
        const step = Number(input.dataset.step || 1);
        const min = Number(input.min);
        const max = Number(input.max);
        const start = Number(input.dataset.start ?? min);
        const optional = input.placeholder === "Default";
        const label = input.closest("label").firstChild.textContent.trim().toLowerCase();
        const button = (text, name, dir) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = text;
          b.tabIndex = -1;
          b.setAttribute("aria-label", `${name} ${label}`);
          b.addEventListener("click", () => {
            if (input.value === "") {
              if (dir > 0) input.value = start;
            } else {
              const value = Number(input.value) + dir * step;
              input.value = value < min ? (optional ? "" : min) : Math.min(value, max);
            }
          });
          return b;
        };
        const stepper = document.createElement("span");
        stepper.className = "stepper";
        input.replaceWith(stepper);
        stepper.append(button("\u2212", "Less", -1), input, button("+", "More", 1));
      }

      const currentPreset = () => manage.presets.find((p) => p.name === manage.settings.preset);

      // Offers the chosen game's modes and maps, with the gateway's thumbnails of each game's
      // maps.
      function showSettingsPreset(map) {
        const preset = manage.presets.find((p) => p.name === presetSelect.value);
        document.getElementById("s-mode").replaceChildren(
          ...preset.gameTypes.map((name) => new Option(name, name)),
        );
        chosenMap = preset.maps.includes(map) ? map : preset.maps[0];
        const sameGame = preset.name === manage.settings.preset;
        document.getElementById("s-maps").replaceChildren(
          ...preset.maps.map((name) => {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "map";
            tile.setAttribute("aria-pressed", String(name === chosenMap));
            const shot = document.createElement("div");
            shot.className = "shot";
            const url = `/api/presets/${encodeURIComponent(preset.name)}/levelshots/${name.toLowerCase()}.jpg`;
            const img = new Image();
            img.onload = () => (shot.style.backgroundImage = `url("${url}")`);
            img.onerror = () => shot.classList.add("missing");
            img.src = url;
            const label = document.createElement("span");
            label.textContent = name;
            tile.append(shot, label);
            tile.addEventListener("click", () => {
              chosenMap = name;
              for (const other of tile.parentElement.children) {
                other.setAttribute("aria-pressed", String(other === tile));
              }
            });
            return tile;
          }),
        );
        const bots = document.getElementById("s-bots");
        bots.hidden = !preset.bots;
        document.getElementById("s-switch").textContent = sameGame
          ? ""
          : `Switching to ${preset.title} restarts the server. Everyone rejoins once it's back, in a minute or so.`;
        document.getElementById("s-note").hidden = !sameGame;
      }

      function openSettings() {
        const settings = manage.settings;
        settingsForm.reset();
        presetSelect.value = currentPreset() ? settings.preset : manage.presets[0].name;
        showSettingsPreset(settings.map);
        for (const name of ["gameType", "bots", "fragLimit", "timeLimit", "captureLimit", "maxPlayers"]) {
          if (settings[name] != null) settingsForm.elements.namedItem(name).value = settings[name];
        }
        document.getElementById("s-error").textContent = "";
        document.getElementById("s-note").textContent =
          "Changes apply right away and reload the map. Players stay connected.";
        document.getElementById("s-apply").disabled = false;
        pauseMenu.hidden = true;
        settingsPanel.hidden = false;
        presetSelect.focus();
      }

      if (manage && manage.presets.length > 0) {
        for (const input of settingsForm.querySelectorAll('input[type="number"]')) addStepper(input);
        presetSelect.replaceChildren(...manage.presets.map((p) => new Option(p.title, p.name)));
        presetSelect.addEventListener("change", () => showSettingsPreset(chosenMap));
        document.getElementById("open-settings").hidden = false;
        document.getElementById("open-settings").addEventListener("click", openSettings);
        document.getElementById("s-back").addEventListener("click", closeSettings);
        settingsForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          const data = { ...manage.settings, ...Object.fromEntries(new FormData(settingsForm)) };
          data.map = chosenMap;
          data.bots = Number(data.bots || 0);
          for (const name of ["fragLimit", "timeLimit", "captureLimit", "maxPlayers"]) {
            data[name] = data[name] ? Number(data[name]) : null;
          }
          const apply = document.getElementById("s-apply");
          const error = document.getElementById("s-error");
          const note = document.getElementById("s-note");
          apply.disabled = true;
          error.textContent = "";
          let result;
          try {
            const response = await fetch(`/api/servers/${server.namespace}/${server.name}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (!response.ok) {
              error.textContent = (await response.text()) || "Changing the server failed.";
              apply.disabled = false;
              return;
            }
            result = await response.json();
          } catch {
            error.textContent = "Changing the server failed.";
            apply.disabled = false;
            return;
          }
          manage.settings = data;
          if (result.applied === "restart") {
            note.textContent = "Switching games. This page rejoins once the server's back.";
            return;
          }
          note.textContent =
            result.applied === "live"
              ? `Changing to ${data.map}…`
              : "Saved. The server picks up the change within a minute or two.";
          setTimeout(() => {
            closeSettings();
            document.getElementById("pause-hint").textContent =
              result.applied === "live" ? "The server is changing map." : "The change applies soon.";
          }, 1200);
        });
      }

      // Rejoins after the server changes in a way the running game can't follow: a different
      // game, or a map whose files the page didn't download. The files are cached, so this is
      // quick, and the form submits itself.
      // waitFor is the game the server is switching to, which the page waits for before joining.
      function rejoin(waitFor = null) {
        try {
          sessionStorage.setItem("rejoin", JSON.stringify({ password: passwordInput.value, waitFor }));
        } catch {}
        location.reload();
      }

      function notice(text) {
        const el = document.getElementById("notice");
        el.textContent = text;
        el.hidden = !text;
      }

      // Checks on the server while playing. available is the maps whose files the game has, or
      // null when it reads files as it needs them.
      function watchServer(available) {
        let game;
        setInterval(async () => {
          let status;
          try {
            const response = await fetch(`/api/servers/${server.namespace}/${server.name}/status`);
            if (response.status === 404) return notice("This server was deleted.");
            if (!response.ok) return;
            status = await response.json();
          } catch {
            return;
          }
          game ??= status.game;
          // The old server is about to stop, which would leave the game at its menu, so the
          // page waits for the new one in place of the game.
          if (status.game !== game) {
            notice(`The server is switching to ${status.game}…`);
            return rejoin(status.game);
          }
          if (!status.ready) return;
          const map = status.map?.toLowerCase();
          if (available && map && !available.has(map)) {
            notice(`The server changed to ${status.map}. Rejoining…`);
            return rejoin();
          }
          notice("");
        }, 5000);
      }

      passwordInput.hidden = !server.needsPassword;
      document.getElementById("eula-row").hidden = stored("demoEulaAccepted") === "yes";

      const MB = 1e6;
      const formatSize = (bytes) => `${Math.max(1, Math.round(bytes / MB)).toLocaleString()} MB`;
      const total = (assets) => assets.reduce((sum, asset) => sum + asset.compressed, 0);
      // Everything downloaded stays in memory while playing, which phones run out of first.
      const isPhone =
        navigator.userAgentData?.mobile ?? /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

      // Pak names in the manifest come with checksums, so a cached copy never goes stale and
      // can be shared by every server using the same file. The cache needs HTTPS.
      const cacheKey = (asset) => `/cache/${asset.checksum}/${asset.name}`;
      const openCache = () =>
        window.caches ? caches.open("quake-kube-assets").catch(() => null) : Promise.resolve(null);

      // Calls onProgress with each part's size as it arrives.
      async function loadAsset(asset, onProgress) {
        const cache = await openCache();
        const cached = await cache?.match(cacheKey(asset));
        if (cached) {
          const data = new Uint8Array(await cached.arrayBuffer());
          onProgress(asset.compressed);
          return data;
        }
        const name = asset.name.replace(/(.+\/|)(.+?)$/, `$1${asset.checksum}-$2`);
        const response = await fetch(`${base}/assets/${name}`);
        if (!response.ok) {
          throw new Error(`Downloading ${asset.name} failed (${response.status}).`);
        }
        // Cached from a copy of the response as it downloads. Reading back a Blob of the parts
        // fails for paks as large as a mod's.
        const caching = cache?.put(cacheKey(asset), response.clone()).catch(() => {});
        const data = new Uint8Array(asset.compressed);
        let size = 0;
        const reader = response.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          if (size + value.length > data.length) {
            throw new Error(`Downloading ${asset.name} failed (larger than expected).`);
          }
          data.set(value, size);
          size += value.length;
          onProgress(value.length);
        }
        await caching;
        return data.subarray(0, size);
      }

      // The files of the server's game: those needed to join, and the paks of the other maps it
      // rotates through, which can come later. Other maps' paks aren't needed, unless the
      // content's profile says a map reads files from them.
      async function gameFiles() {
        const [info, manifest, profile] = await Promise.all([
          fetch(`${base}/info`).then((response) => response.json()),
          fetch(`${base}/assets/manifest.json`).then((response) => response.json()),
          fetch(`${base}/paks/profile.json`)
            .then((response) => (response.ok ? response.json() : null))
            .catch(() => null),
        ]);
        // A server running a mod reports the mod's directory as its game.
        const gameDirs = ["baseq3", info.game].filter(Boolean);
        const map = (info.mapname || "").toLowerCase();
        const assets = manifest.filter((asset) => gameDirs.includes(asset.name.split("/")[0]));
        // Whether a map reads from a map's pak. The renderer reads every pak's shader scripts,
        // so those don't count.
        const reads = (name, asset) =>
          asset.maps.includes(name) ||
          Object.entries(mergeFiles(profile?.common, profile?.maps?.[name])).some(
            ([pak, files]) => pak === asset.name && files.some((file) => !file.startsWith("scripts/")),
          );
        return {
          info,
          profile,
          paks: assets.filter((asset) => asset.name.endsWith(".pk3")),
          now: assets.filter((asset) => !asset.maps || reads(map, asset)),
          later: assets.filter(
            (asset) =>
              asset.maps &&
              !reads(map, asset) &&
              server.maps.some((name) => reads(name, asset)),
          ),
        };
      }

      // Combines lists of files by pak, like a profile's.
      function mergeFiles(...lists) {
        const files = {};
        for (const list of lists) {
          for (const [pak, names] of Object.entries(list ?? {})) (files[pak] ??= []).push(...names);
        }
        return files;
      }

      function writeFile(module, path, data) {
        module.FS.mkdirTree(path.replace(/\/[^/]+$/, ""));
        // Mods can have gigabytes of paks, so the files aren't copied.
        module.FS.writeFile(path, data, { canOwn: true });
      }

      // Says how much joining downloads, before anyone commits to it.
      async function describeDownload() {
        const download = document.getElementById("download");
        if (onDemand) {
          download.textContent = "Game files load as the game needs them.";
          return;
        }
        const { now } = await gameFiles();
        const size = total(now);
        const cache = await openCache();
        let cached = 0;
        for (const asset of now) {
          if (await cache?.match(cacheKey(asset))) cached += asset.compressed;
        }
        download.textContent =
          cached >= size
            ? `Game files: ${formatSize(size)}, already downloaded.`
            : cached > 0
              ? `Joining downloads ${formatSize(size - cached)} of ${formatSize(size)} of game files.`
              : `Joining downloads ${formatSize(size)} of game files.`;
        if (isPhone && size > 500 * MB) {
          const warning = document.createElement("span");
          warning.className = "warning";
          warning.textContent = "Phones may not have enough memory for a game this large.";
          download.append(warning);
        }
      }
      // After the server changed under a running game, join again without asking, once it's
      // ready, and running the game it switched to.
      let rejoining = null;
      try {
        rejoining = JSON.parse(sessionStorage.getItem("rejoin"));
        sessionStorage.removeItem("rejoin");
      } catch {}
      if (rejoining && stored("demoEulaAccepted") === "yes") {
        passwordInput.value = rejoining.password || "";
        waitForServer(rejoining.waitFor).then((ready) => {
          document.getElementById("join").classList.remove("waiting");
          if (ready) {
            form.requestSubmit();
          } else {
            setStatus("The server didn't come back. Try joining again.");
            describeDownload().catch(() => {});
          }
        });
      } else {
        describeDownload().catch(() => {});
      }

      // Waits until the server is ready running game, or any game when it's null, for up to
      // five minutes.
      async function waitForServer(game) {
        const join = document.getElementById("join");
        join.classList.add("waiting");
        setStatus(game ? `Switching to ${game}…` : "Rejoining…");
        const deadline = Date.now() + 5 * 60 * 1000;
        while (Date.now() < deadline) {
          try {
            const response = await fetch(`/api/servers/${server.namespace}/${server.name}/status`);
            if (response.status === 404) return false;
            if (response.ok) {
              const status = await response.json();
              if (status.ready && (!game || status.game === game)) return true;
            }
          } catch {}
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
        return false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (stored("demoEulaAccepted") !== "yes" && !eulaInput.checked) {
          setStatus("Agree to the demo license to download the game files.");
          return;
        }
        store("demoEulaAccepted", "yes");
        const playerName = nameInput.value.trim() || "UnnamedPlayer";
        store("playerName", playerName);
        store("voiceChat", voiceInput.checked ? "yes" : "no");
        // The microphone is asked for now, while the browser's prompt can be answered. Without it,
        // the engine doesn't open the microphone at all.
        let voice = voiceInput.checked && !document.getElementById("voice-row").hidden;
        if (voice) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            for (const track of stream.getTracks()) track.stop();
          } catch (error) {
            console.warn("Voice chat is off, without the microphone:", error);
            voice = false;
          }
        }
        const button = form.querySelector("button");
        button.disabled = true;

        try {
          setStatus("Loading game files…");
          const { info, profile, paks, now, later } = await gameFiles();
          const map = (info.mapname || "").toLowerCase();
          let files, remote;
          if (onDemand) {
            remote = new RemotePaks();
            await Promise.all(paks.map((asset) => remote.add(asset)));
            await remote.openCache();
            globalThis.quakeKubePaks = remote;
            if (profile) {
              let loaded = 0;
              const { total: size, done } = remote.prefetch(
                mergeFiles(profile.common, profile.maps?.[map]),
                (bytes) => {
                  loaded += bytes;
                  setStatus(`Loading game files… ${formatSize(loaded)} of ${formatSize(size)}`);
                },
              );
              await done;
            }
            // Empty stand-ins, so the engine finds the paks it then reads through remote.
            files = paks.map((asset) => ({ path: `/${asset.name}`, data: new Uint8Array(0) }));
          } else {
            const size = total(now);
            let loaded = 0;
            files = await Promise.all(
              now.map(async (asset) => ({
                path: `/${asset.name}`,
                data: await loadAsset(asset, (bytes) => {
                  loaded += bytes;
                  setStatus(`Loading game files… ${formatSize(loaded)} of ${formatSize(size)}`);
                }),
              })),
            );
          }

          setStatus("Starting…");
          const args = [
            "+set", "net_enabled", "1",
            "+set", "r_mode", "-2",
            // The page has the full screen button, since the canvas alone in full screen
            // hides the page's menus.
            "+set", "r_fullscreen", "0",
            "+set", "cl_motd", "0",
            "+set", "com_basegame", "baseq3",
            "+name", playerName,
          ];
          if (info.game) {
            args.push("+set", "fs_game", info.game);
          }
          if (passwordInput.value) {
            args.push("+set", "password", passwordInput.value);
          }
          if (!voice) {
            args.push("+set", "s_alCapture", "0");
          }
          // GameSocket decides where traffic goes, so any address works here except localhost,
          // which the engine treats as a server of its own.
          args.push("+connect", `${server.name}.${server.namespace}`);

          const client = onDemand ? "/client/jspi" : "/client";
          const { default: ioquake3 } = await import(`${client}/ioquake3.js?v=${clientVersion}`);
          document.getElementById("join").remove();
          let started;
          const engineStarted = new Promise((resolve) => (started = resolve));
          // The maps whose files the game has, when it doesn't read files as it needs them.
          const available = onDemand ? null : new Set();
          const addMaps = (assets) => {
            for (const asset of assets) for (const name of asset.maps ?? []) available?.add(name.toLowerCase());
          };
          addMaps(now);
          available?.add(map);
          watchServer(available);
          const module = await ioquake3({
            canvas: document.getElementById("canvas"),
            arguments: args,
            locateFile: (file) => `${client}/${file}?v=${clientVersion}`,
            // The JSPI build calls this once main has started the engine.
            quakeKubeStarted: () => started(),
            preRun: [
              (module) => {
                for (const file of files.splice(0)) {
                  writeFile(module, file.path, file.data);
                }
              },
            ],
            // The engine's console output, for troubleshooting from the browser's tools. It
            // writes its console to stderr. Once the map has loaded, the player is asked to
            // click to play.
            print: (text) => console.log(text),
            printErr: (text) => {
              console.warn(text);
              if (!playing && text.startsWith("CL_InitCGame:")) showPause();
            },
            onExit: () => (location.href = "/"),
          });
          if (onDemand) {
            // The files of the server's other maps, for when it changes map.
            const others = server.maps.filter((name) => name !== map);
            if (profile && others.length > 0) {
              remote.prefetch(mergeFiles(...others.map((name) => profile.maps?.[name])));
            }
            // The page runs frames, as a JSPI export that can wait for pak reads.
            await engineStarted;
            for (;;) {
              await module._quake_kube_frame();
              await new Promise(requestAnimationFrame);
            }
          }
          // The paks of the server's other maps, for when it changes map. The engine looks
          // for paks again whenever it loads a map.
          for (const asset of later) {
            try {
              writeFile(module, `/${asset.name}`, await loadAsset(asset, () => {}));
              addMaps([asset]);
            } catch (error) {
              console.warn(`Downloading ${asset.name} failed:`, error);
            }
          }
        } catch (error) {
          setStatus(error.message);
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
