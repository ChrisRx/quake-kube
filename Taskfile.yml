version: "3"

vars:
  BIN_DIR: bin

tasks:
  default:
    desc: List the tasks
    silent: true
    cmds:
      - task --list

  # Build

  build:
    desc: Build the q3 binary
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags '-s -w' -o {{.BIN_DIR}}/q3 ./cmd/q3

  docs:
    desc: Build the mdBook docs
    cmds:
      - mdbook build docs

  chart:package:
    desc: Package the Helm chart, with the version in chart/Chart.yaml
    cmds:
      - helm package chart --destination dist

  chart:push:
    desc: Push the Helm chart, replacing the published one with the same version
    vars:
      VERSION:
        sh: "sed -n 's/^version: *//p' chart/Chart.yaml"
      # The chart lands at <registry>/quake-kube.
      REGISTRY: '{{.REGISTRY | default "oci://ghcr.io/chrisrx"}}'
    cmds:
      - task: chart:package
      - helm push {{.CLI_ARGS}} dist/quake-kube-{{.VERSION}}.tgz {{.REGISTRY}}

  crds:
    desc: Generate the chart's CRDs from the controller's types
    dir: controllers
    cmds:
      - cargo run --quiet -- crdgen ../chart/files/crds

  # Development

  cluster:
    desc: Create the local k3d cluster with MetalLB and cert-manager
    cmds:
      - hack/dev.sh up

  cluster-delete:
    desc: Delete the local k3d cluster
    cmds:
      - hack/dev.sh down

  ui:
    desc: Open the dev cluster's web app, with mkcert's CA if there is one (see ui:trust)
    cmds:
      - hack/dev.sh ui

  ui:forward:
    desc: Open the web app through a port-forward on the current kubectl context, e.g. task ui:forward NAMESPACE=games
    vars:
      NAMESPACE: '{{.NAMESPACE | default "quake-kube"}}'
      RELEASE: '{{.RELEASE | default "quake-kube"}}'
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - hack/dev.sh forward {{.NAMESPACE}} {{.RELEASE}} {{.PORT}}

  ui:trust:
    desc: Have your browsers trust a local CA from mkcert, which every dev cluster then uses (once per machine)
    cmds:
      - hack/dev.sh trust

  ui:ca:
    desc: Write the dev cluster's CA certificate and print how to trust it in a browser
    cmds:
      - hack/dev.sh ca

  content:profile:
    desc: Write a content image's profile from the dev cluster, e.g. task content:profile PRESET=cpma CONTENT=cpma
    requires:
      vars: [PRESET, CONTENT]
    cmds:
      - hack/profile.sh {{.PRESET}} content/{{.CONTENT}}/profile.json

  dev:
    desc: Run the tilt dev environment, creating the cluster if needed
    deps: [cluster]
    cmds:
      - hack/dev.sh tilt

  # Checks

  test:
    desc: Run the Go and Rust tests
    deps: [test:go, test:rust]

  test:go:
    desc: Run the Go tests
    cmds:
      - go test -v ./internal/...

  test:rust:
    desc: Run the Rust tests
    dir: controllers
    cmds:
      - cargo test

  lint:
    desc: Run the Go, Rust and Helm linters
    deps: [lint:go, lint:rust, lint:chart]

  lint:go:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:rust:
    desc: Run clippy and check formatting
    dir: controllers
    cmds:
      - cargo clippy --all-targets
      - cargo fmt --check

  lint:chart:
    desc: Lint the Helm chart
    cmds:
      - helm lint chart

  clean:
    desc: Clean up build outputs
    cmds:
      - rm -f {{.BIN_DIR}}/* result
